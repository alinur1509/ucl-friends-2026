<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Наш турнир ЛЧ 2026/27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: matchday-programme app — compact masthead with a 144-segment progress strip, tabbed views, data tables in scroll boxes */
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --surface-2:#F4F6FB; --ink:#0E1838; --muted:#5B6685; --line:#D9DFEC;
  --accent:#2643D6; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --win:#178A50; --win-soft:#DDF2E5; --loss:#C2412D; --loss-soft:#F8E1DC; --draw:#8A93A8;
  --z1:#178A50; --z2:#2643D6; --z3:#A3ABBE; --gold:#C98F12;
  --p0:#E4572E; --p1:#0E9C88; --p2:#C99512; --p3:#7B4FD6;
  --mast:#0E1838; --mast-ink:#F1F4FC; --mast-muted:#A9B3D2;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1024; --surface:#121A36; --surface-2:#17214A; --ink:#E8ECF8; --muted:#98A2C2; --line:#27315C;
  --accent:#7189FF; --accent-ink:#0A1024; --accent-soft:#1E2A5E;
  --win:#3CC27F; --win-soft:#123A2A; --loss:#F07259; --loss-soft:#43201C; --draw:#8A93A8;
  --z1:#3CC27F; --z2:#7189FF; --z3:#4A5478; --gold:#F2C230;
  --p0:#FF7A52; --p1:#2CC7B0; --p2:#F2C230; --p3:#A585FF;
  --mast:#060B1C; --mast-ink:#F1F4FC; --mast-muted:#8E99BD; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1024; --surface:#121A36; --surface-2:#17214A; --ink:#E8ECF8; --muted:#98A2C2; --line:#27315C;
  --accent:#7189FF; --accent-ink:#0A1024; --accent-soft:#1E2A5E;
  --win:#3CC27F; --win-soft:#123A2A; --loss:#F07259; --loss-soft:#43201C; --draw:#8A93A8;
  --z1:#3CC27F; --z2:#7189FF; --z3:#4A5478; --gold:#F2C230;
  --p0:#FF7A52; --p1:#2CC7B0; --p2:#F2C230; --p3:#A585FF;
  --mast:#060B1C; --mast-ink:#F1F4FC; --mast-muted:#8E99BD; color-scheme:dark}

*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.log{display:grid}
.log div{display:flex;gap:10px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.log div:last-child{border-bottom:0}
.log time{color:var(--muted);font-size:12px;min-width:92px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mast)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* masthead */
.mast{background:var(--mast);color:var(--mast-ink)}
.mast .wrap{padding-block:22px 16px;display:grid;gap:14px}
.mast h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,4.2vw,34px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
.mast h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mast-muted);margin-bottom:6px}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.md-bar{display:grid;gap:4px}
.md-bar .cells{display:grid;grid-template-columns:repeat(18,1fr);gap:1px;height:8px}
.md-bar .cells i{background:#ffffff22;border-radius:1px}
.md-bar .cells i.on{background:var(--gold)}
.md-bar span{font-size:10.5px;color:var(--mast-muted);letter-spacing:.06em}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px;color:var(--mast-muted)}
.meta b{color:var(--mast-ink);font-weight:600}
.status{display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--draw)}
.status.ok i{background:#3CC27F}.status.ro i{background:var(--gold)}.status.off i{background:#F07259}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--mast);border-top:1px solid #ffffff14}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs a{color:var(--mast-muted);text-decoration:none;padding:11px 14px;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
.tabs a[aria-current="page"]{color:var(--mast-ink);border-bottom-color:var(--gold)}

main .wrap{padding-block:20px 48px;display:grid;gap:18px}
h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.note{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:13.5px}
.note.warn{background:var(--loss-soft)}

/* badges */
.bdg{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:8.5px;letter-spacing:.02em;flex:none;box-shadow:inset 0 0 0 2px var(--b2),0 0 0 1px var(--line)}
.bdg.sm{width:20px;height:20px;font-size:7px}
.club{display:flex;align-items:center;gap:9px;min-width:0}
.club .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club .cty{color:var(--muted);font-size:11.5px;font-weight:500}
.own{width:9px;height:9px;border-radius:50%;flex:none}
.p0{background:var(--p0)}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}

/* owners leaderboard */
.owners{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.owners{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ocard{padding:12px 14px;display:grid;gap:6px;border-top:4px solid var(--c)}
.ocard .name{font-weight:700;display:flex;justify-content:space-between;gap:8px;min-width:0}
.ocard .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ocard .big{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1}
.ocard .row{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.ocard .rank{font-size:12px;color:var(--muted);font-weight:600}

/* filters */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* league table */
.scroll{overflow-x:auto;border-radius:var(--r)}
table.lt{width:100%;border-collapse:collapse;min-width:640px}
.lt th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.lt th.l{text-align:left}
.lt td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.lt td.l{text-align:left}
.lt tr:last-child td{border-bottom:0}
.lt .pos{width:40px;font-weight:700;position:relative}
.lt .pos::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:4px;border-radius:2px;background:var(--z)}
.lt .pts{font-weight:800;font-size:15px}
.lt tr.cut td{border-bottom:2px solid var(--muted)}
.lt tr.dim{opacity:.38}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:4px;font-style:normal;font-size:9.5px;font-weight:700;display:grid;place-items:center;color:#fff}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
.form .n{background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;background:var(--z)}

/* matches */
.mlist{display:grid}
.day{padding:10px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--surface-2);border-bottom:1px solid var(--line)}
.panel>.day:first-child{border-radius:var(--r) var(--r) 0 0}
.m{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m .club.away{flex-direction:row-reverse;text-align:right}
.score{display:flex;align-items:center;gap:5px}
.score input{width:42px;height:36px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.score input::-webkit-outer-spin-button,.score input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.score input:disabled{opacity:.7}
.score .dash{color:var(--muted);font-weight:700}
.m.done .score input{background:var(--surface);border-color:var(--muted)}
.m.saving .score input{border-color:var(--gold)}
.m.hl{background:var(--accent-soft)}
.otag{color:var(--c);font-weight:700}
@media (max-width:520px){.m{padding:9px 10px;gap:6px}.m .club .ctry{display:none}.score input{width:36px}}

/* knockout */
.rounds{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.round{display:grid;gap:10px;align-content:start}
.round h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tie{padding:10px 12px;display:grid;gap:6px}
.tie .hd{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 30px;gap:4px;font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;text-align:center}
.tie .hd span:first-child{text-align:left}
.tie .tr{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px 30px;gap:4px;align-items:center}
.tie.single .hd,.tie.single .tr{grid-template-columns:minmax(0,1fr) 44px 30px}
.tie input{width:44px;height:32px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.tie input::-webkit-outer-spin-button,.tie input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tie .agg{font-weight:800;text-align:center}
.tie .tr.win .nm{color:var(--win)}
.tie .tr.lose{opacity:.55}
.tie .seed{font-size:11px;color:var(--muted);font-weight:600;width:22px;flex:none}
.tie .tbd{color:var(--muted);font-style:italic;font-size:13px}
.pens{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pens button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 8px;font-size:12px;font-weight:600;cursor:pointer}
.pens button[aria-pressed="true"]{background:var(--win);color:#fff;border-color:var(--win)}
.champ{padding:18px;display:flex;gap:14px;align-items:center;border:2px solid var(--gold)}
.champ .t{font-family:var(--f-display);font-size:20px;font-weight:800}

/* players & draft */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pin{display:grid;gap:6px;padding:12px;border-top:4px solid var(--c)}
.pin label{font-size:12px;color:var(--muted);font-weight:600}
.pin input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2);font-weight:600;width:100%}
.pin .cnt{font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{background:var(--loss);border-color:var(--loss);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.fbar{padding:10px 12px;display:grid;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip.sm{padding:5px 10px;font-size:12.5px}
.chip .cnt{font-weight:500;opacity:.7;font-size:11px}
.sel{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);min-width:0;max-width:100%}
.sel select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
.btn.sm{padding:6px 10px;font-size:12.5px}
.linkish{all:unset;cursor:pointer;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px}
.linkish:hover{text-decoration:underline;text-underline-offset:3px}
.linkish:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m .when{grid-column:1/-1;text-align:center;font-size:11.5px;color:var(--muted);margin-top:-2px}
.m .when b{color:var(--ink);font-weight:600}
.tcard{display:grid;border:2px solid var(--accent)}
.tcard .thead{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tcard .thead .bdg{width:38px;height:38px;font-size:11px}
.tcard .tname{font-family:var(--f-display);font-weight:600;font-size:17px}
.tcard .tname .cty{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.tcard #f-team-clear{margin-left:auto;flex:none}
.tie.focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.turn{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:2px solid var(--c,var(--win))}
.turn .tl{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,3vw,22px)}
.turn .ts{color:var(--muted);font-size:13px}
.turn.done{border-color:var(--win)}
.pin.now{box-shadow:0 0 0 2px var(--c)}
.first{padding:12px 14px;display:grid;gap:8px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:6px}
.qmove{display:inline-flex;gap:4px}
.btn.xs{padding:2px 8px;font-size:12px;line-height:1.4}
.btn:disabled{opacity:.4;cursor:default}
.dboard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:820px){.dboard{grid-template-columns:minmax(0,1fr)}}
.dpot h3{margin:0 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.dpot h3 span{letter-spacing:0;text-transform:none;font-weight:500}
.dgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:480px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dcard{position:relative;display:grid;justify-items:center;gap:5px;padding:12px 8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:center;font:inherit;color:inherit;min-width:0;overflow:hidden}
button.dcard{cursor:pointer}
button.dcard:hover:not(:disabled){box-shadow:0 0 0 2px var(--accent)}
button.dcard:disabled{cursor:default;opacity:.75}
.dcard .bdg{width:34px;height:34px;font-size:10px}
.dcard .dn{font-weight:700;font-size:12.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .who{font-size:11px;color:var(--muted);display:inline-flex;gap:5px;align-items:center;max-width:100%;overflow:hidden;white-space:nowrap}
.dcard.taken{background:color-mix(in srgb, var(--c) 22%, var(--surface));border-color:var(--c)}
.dcard.taken .bdg,.dcard.taken .dn{opacity:.55}
.dcard.taken .who{color:var(--ink);font-weight:600}
.dcard.waiting{background:var(--surface-2);opacity:.45}
.dpot.active h3{color:var(--accent)}
.dcard.blocked{background:var(--surface-2);border-style:dashed;opacity:.55}
.dcard.blocked .who{color:var(--loss);white-space:normal;line-height:1.25}
.warnc{color:var(--loss)}
.dcard .stamp{position:absolute;top:7px;right:-26px;transform:rotate(35deg);background:var(--loss);color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 28px}
.roster{padding:12px 14px;border-top:4px solid var(--c);display:grid;gap:8px}
.roster ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px}
.roster li{padding-left:2px}
.roster li>*{vertical-align:middle}
.roster li span{margin-left:6px}
.roster li.empty{color:var(--muted)}
.cform{padding:12px 14px;display:grid;gap:10px}
.crow{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.fld{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted);min-width:0;flex:1 1 200px}
.fld.inline{flex:0 1 auto}
.fld select,.fld input{font:inherit;font-size:14px;font-weight:500;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.fld input[type=number]{width:80px}
.cc{display:inline-block;width:9px;height:13px;border-radius:2px;vertical-align:-2px;margin-right:2px}
.cc.y{background:#F2C230}.cc.r{background:#D7263D}
.chip.static{cursor:default}
.slist{display:grid}
.srow{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.s-main{min-width:0}
.slist>.sub{padding:12px 14px}
.cpill{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:2px 0;white-space:nowrap}
.susp{grid-column:1/-1;font-size:12px;color:var(--loss);text-align:center}
.tie .susp{text-align:left}
.addcard{font-size:11.5px;color:var(--accent);font-weight:600}
.icard{grid-column:1/-1;display:grid;gap:8px;padding:10px 12px;margin-top:4px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);text-align:left}
.ilist{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.iplayer{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;flex:1 1 180px;min-width:0}
.kocards{font-size:11.5px;color:var(--muted)}
.codein{font:inherit;width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.pcards{grid-template-columns:minmax(0,1fr)}}
.pcard{padding:14px 16px;display:grid;gap:10px;border-top:5px solid var(--c);min-width:0}
.phead{display:flex;gap:12px;align-items:center}
.pplace{font-family:var(--f-display);font-weight:800;font-size:28px;color:var(--c);min-width:28px}
.pname{font-family:var(--f-display);font-weight:600;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppts{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:28px;text-align:right;line-height:1}
.ppts small{display:block;font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}
.pgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--surface-2);border-radius:8px;padding:8px}
.pgrid4 div{display:grid;text-align:center}
.pgrid4 b{font-size:16px}

// Knockout calendar (UEFA): first leg / second leg
const KO_DATES = {PO:"16/17 и 23/24 февраля", R:"9/10 и 16/17 марта", QF:"6/7 и 13/14 апреля",
  SF:"27/28 апреля и 4/5 мая", F:"5 июня 2027 · Мадрид, «Метрополитано»"};

// ---- date & time helpers: UEFA times are Central European (summer time until 25 Oct 2026)
const WD = ["вс","пн","вт","ср","чт","пт","сб"], MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function dayLabel(iso){ const [y,m,d] = iso.split("-").map(Number); const wd = new Date(Date.UTC(y,m-1,d)).getUTCDay(); return `${WD[wd]}, ${d} ${MON[m-1]}`; }
function kickoffUTC(f){ const [y,m,d] = f.date.split("-").map(Number), [hh,mm] = f.time.split(":").map(Number);
  const off = f.date < "2026-10-25" ? 2 : 1; return new Date(Date.UTC(y,m-1,d,hh-off,mm)); }
function localTime(f){
  try {
    const t = kickoffUTC(f);
    const hm = t.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
    const ld = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    const [y,m,d] = f.date.split("-").map(Number);
    const shift = Math.round((ld - new Date(y, m-1, d)) / 864e5);
    return hm + (shift > 0 ? " (след. день)" : shift < 0 ? " (пред. день)" : "");
  } catch(e){ return ""; }
}

const PLAYER_DEFAULT = ["Игрок 1","Игрок 2","Игрок 3","Игрок 4"];
// opponents in the league phase, per club
const OPP = {}; CODES.forEach(c=>OPP[c]=new Set());
FIXTURES.forEach(f=>{ OPP[f.h].add(f.a); OPP[f.a].add(f.h); });
// Draft rules for the player on turn (same as on the server):
// 1) opponents of clubs they already own are blocked;
// 2) pots go in order: pick from the first pot that has a non-blocked free club;
// 3) if no pot has one, any free club from the lowest pot that still has free clubs.
const POT_OF = c => Math.floor(CODES.indexOf(c) / 9);
function draftOptions(owner, p){
  const free = CODES.filter(c=>![0,1,2,3].includes(owner[c]));
  const why = {};
  CODES.forEach(c=>{ if (owner[c]===p) OPP[c].forEach(o=>{ (why[o] ||= []).push(c); }); });
  const open = free.filter(c=>!why[c]);
  const fallback = open.length===0;
  const base = fallback ? free : open;
  const pot = base.length ? Math.min(...base.map(POT_OF)) : -1;
  const allowed = base.filter(c=>POT_OF(c)===pot);
  return {free, why, allowed, pot, fallback};
}

// ---------------------------------------------------------------- state

  results:{},            // matchId -> {h,a}
  ko:{},                 // tieId -> {a,b,l1:{hi,lo},l2:{hi,lo},pen}

  cardForm:{match:"", team:"", type:"Y", games:1}, cardDel:null,

  cfg:{names:["","","",""], owner:{}, picks:[], order:[0,1,2,3]},
  canWrite:false, dbReady:false, log:[], rev:-1,
  md:0, filter:null, team:null, status:"all", confirm:null,
};
try { const saved = JSON.parse(localStorage.getItem("ucl-filters") || "{}");
  if ([0,1,2,3].includes(saved.filter)) S.filter = saved.filter;
  if (typeof saved.team === "string" && CLUBS[saved.team]) S.team = saved.team;
  if (saved.md >= 0 && saved.md <= 8) S.md = saved.md;
  if (["all","open","done"].includes(saved.status)) S.status = saved.status;

function saveFilters(){ try { localStorage.setItem("ucl-filters", JSON.stringify({filter:S.filter, team:S.team, md:S.md, status:S.status})); } catch(e){} }
// Shared state lives behind /api/state (Vercel Function + Vercel Blob).
let inflight = 0, queue = Promise.resolve();
// Only accept a state that is at least as new as what we already show (rev is bumped on every save),
// so a slow or cached response can never roll the page back.
function applyState(st){
  if (!st || typeof st !== "object") return false;
  const rev = Number.isInteger(st.rev) ? st.rev : 0;
  if (rev < S.rev) return false;
  S.rev = rev;
  S.results = st.results || {}; S.ko = st.ko || {};
  S.cards = st.cards && typeof st.cards === "object" ? st.cards : {};
  const c = st.cfg || {};
  S.cfg = {names: Array.isArray(c.names) ? [...c.names] : ["","","",""], owner: c.owner ? {...c.owner} : {},
    picks: Array.isArray(c.picks) ? [...c.picks] : [], order: Array.isArray(c.order) && c.order.length===4 ? [...c.order] : [0,1,2,3]};
  S.log = Array.isArray(st.log) ? st.log : [];
  return true;
}
function send(body){
  inflight++;
  queue = queue.then(async ()=>{
    try {
      const res = await fetch("/api/state", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)});
      const data = await res.json().catch(()=>({}));
      if (!res.ok){ if (data.state) applyState(data.state); const err = new Error(data.error || ("ошибка " + res.status)); err.soft = res.status < 500; throw err; }
      if (inflight === 1) applyState(data);   // with more saves queued, the last answer brings everything
      S.dbReady = true; setStatus();
    } catch (e){
      toast(e.soft ? e.message : "Не сохранилось: " + e.message);
      if (!e.soft){ S.dbReady = false; setStatus(); }
    } finally { inflight--; render(); }
  });
  return queue;
}
async function load(){
  if (inflight) return;
  try {
    const res = await fetch("/api/state", {cache:"no-store"});
    if (!res.ok) throw new Error(res.status);
    const st = await res.json();
    if (inflight) return;
    applyState(st); S.dbReady = true; S.canWrite = true;
  } catch (e){ S.dbReady = false; }
  setStatus(); render();
}

// ---------------------------------------------------------------- helpers
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function badge(code, sm){
  const [, , fill, txt] = CLUBS[code];
  return `<span class="bdg${sm?" sm":""}" style="background:${fill};color:${txt};--b2:${txt}55" aria-hidden="true">${code}</span>`;
}
function ownerOf(code){ const o = S.cfg.owner[code]; return (o === 0 || o) && o >= 0 && o < 4 ? o : null; }
function ownDot(code){ const o = ownerOf(code); return o === null ? "" : `<span class="own p${o}" title="${esc(pname(o))}"></span>`; }
function pname(i){ return (S.cfg.names[i] || "").trim() || PLAYER_DEFAULT[i]; }
function clubCell(code, opts={}){
  const [name, cty] = CLUBS[code];
  const nm = opts.link ? `<button class="nm linkish" data-team="${code}" title="Все матчи ${esc(name)}">${esc(name)}</button>` : `<span class="nm">${esc(name)}</span>`;
  const o = ownerOf(code);
  const tag = o!==null ? `<span class="otag" style="--c:var(--p${o})">${esc(pname(o))}</span>` : "";
  const sub = opts.cty===false ? (tag ? `<span class="cty">${tag}</span>` : "") : `<span class="cty"><span class="ctry">${cty}</span>${tag?` · ${tag}`:""}</span>`;
  return `<span class="club${opts.away?" away":""}">${badge(code, opts.sm)}<span style="min-width:0;display:grid">${nm}${sub}</span>${ownDot(code)}</span>`;
}
let toastT;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 3200); }
const isNum = v => typeof v === "number" && Number.isFinite(v) && v >= 0;

// ---------------------------------------------------------------- standings
function standings(){
  const t = {};
  CODES.forEach(c => t[c] = {c, p:0,w:0,d:0,l:0,gf:0,ga:0,agf:0,aw:0,pts:0,form:[]});
  for (const f of FIXTURES){
    const r = S.results[f.id]; if (!r || !isNum(r.h) || !isNum(r.a)) continue;
    const H=t[f.h], A=t[f.a];
    H.p++; A.p++; H.gf+=r.h; H.ga+=r.a; A.gf+=r.a; A.ga+=r.h; A.agf+=r.a;
    if (r.h>r.a){H.w++;A.l++;H.pts+=3;H.form.push([f.md,"W"]);A.form.push([f.md,"L"]);}
    else if (r.h<r.a){A.w++;H.l++;A.pts+=3;A.aw++;H.form.push([f.md,"L"]);A.form.push([f.md,"W"]);}
    else {H.d++;A.d++;H.pts++;A.pts++;H.form.push([f.md,"D"]);A.form.push([f.md,"D"]);}
  }
  const rows = Object.values(t);
  rows.forEach(r => { r.gd = r.gf-r.ga; r.form.sort((a,b)=>a[0]-b[0]); });
  rows.sort((a,b)=> b.pts-a.pts || b.gd-a.gd || b.gf-a.gf || b.agf-a.agf || b.w-a.w || b.aw-a.aw
    || CLUBS[a.c][0].localeCompare(CLUBS[b.c][0]));
  rows.forEach((r,i)=> r.pos = i+1);
  return rows;
}
const playedCount = () => FIXTURES.filter(f => { const r=S.results[f.id]; return r && isNum(r.h) && isNum(r.a); }).length;

// ---------------------------------------------------------------- knockout
// Seeds 9–24 play off (9 v 24 … 16 v 17); winners meet seeds 1–8 (1 v winner of 16/17 …);
// fixed bracket afterwards. Higher seed hosts the second leg. Final is one match.
function knockout(rows){
  const done = playedCount() === 144;
  const seed = rows.map(r=>r.c), rank = {}; rows.forEach(r=>rank[r.c]=r.pos);
  const ties = {};
  const better = (x,y) => (x && y) ? (rank[x] <= rank[y] ? [x,y] : [y,x]) : [x||null,y||null];
  function resolve(id, x, y, single){
    const [hi, lo] = better(x, y);
    const d = S.ko[id], tie = {id, hi, lo, single, l1:{}, l2:{}, pen:null, winner:null, stale:false};
    if (hi && lo && d){
      if (d.a === hi && d.b === lo){ tie.l1 = d.l1||{}; tie.l2 = d.l2||{}; tie.pen = d.pen||null; }
      else tie.stale = true;
    }
    if (hi && lo){
      const okL1 = isNum(tie.l1.hi) && isNum(tie.l1.lo), okL2 = single || (isNum(tie.l2.hi) && isNum(tie.l2.lo));
      if (okL1 && okL2){
        const ah = tie.l1.hi + (single?0:tie.l2.hi), al = tie.l1.lo + (single?0:tie.l2.lo);
        tie.aggHi = ah; tie.aggLo = al;
        if (ah > al) tie.winner = hi; else if (al > ah) tie.winner = lo;
        else if (tie.pen === "hi") tie.winner = hi; else if (tie.pen === "lo") tie.winner = lo;
        else tie.needPen = true;
      }
    }
    ties[id] = tie; return tie.winner;
  }
  const PO = [], R16 = [], QF = [], SF = [];
  for (let i=0;i<8;i++){ PO.push(resolve(`PO${i+1}`, done?seed[8+i]:null, done?seed[23-i]:null)); }
  for (let k=0;k<8;k++){ R16.push(resolve(`R${k+1}`, done?seed[k]:null, PO[7-k])); }
  [[0,7],[3,4],[1,6],[2,5]].forEach(([a,b],i)=> QF.push(resolve(`QF${i+1}`, R16[a], R16[b])));
  [[0,1],[2,3]].forEach(([a,b],i)=> SF.push(resolve(`SF${i+1}`, QF[a], QF[b])));
  const champ = resolve("F", SF[0], SF[1], true);
  return {done, ties, champ, rank};
}

// ---------------------------------------------------------------- discipline (UEFA 2026/27)
// 4th, 6th, 8th and 10th yellow card → one-match ban. Two yellows in one match = red (those two
// yellows do not count towards the total). Straight red → at least one match (more if entered).
// Yellows are wiped after the quarter-finals: semi-final and final cautions start a new count.
const STAGES = ["PO","R","QF","SF","F"];
const STAGE_NAME = {PO:"плей-офф раунд", R:"1/8 финала", QF:"1/4 финала", SF:"1/2 финала", F:"финал"};
function koParts(mid){ const [, tie, leg] = mid.split(":"); return {tie, leg:+leg, stage: tie.replace(/\d+$/,"")}; }
function matchInfo(mid, K){
  if (mid.startsWith("md")){
    const f = FIXTURES.find(x=>x.id===mid); if (!f) return null;
    return {mid, h:f.h, a:f.a, label:`Тур ${f.md}`, played:isPlayed(f), order:f.md, late:false};
  }
  const {tie, leg, stage} = koParts(mid), t = K.ties[tie]; if (!t || !t.hi || !t.lo) return null;
  const single = stage === "F";
  if (single && leg !== 1) return null;
  const [h, a] = single || leg === 2 ? [t.hi, t.lo] : [t.lo, t.hi];
  const side = leg === 1 ? t.l1 : t.l2;
  return {mid, h, a, label: single ? "Финал" : `${STAGE_NAME[stage][0].toUpperCase()+STAGE_NAME[stage].slice(1)}, ${leg}-й матч`,
    played: isNum(side.hi) && isNum(side.lo), order: 10 + STAGES.indexOf(stage)*2 + leg, late: stage==="SF"||stage==="F"};
}
function teamSeq(code, K){
  const seq = FIXTURES.filter(f=>f.h===code||f.a===code).sort((x,y)=>x.md-y.md).map(f=>matchInfo(f.id, K));
  for (const st of STAGES){
    const ids = st==="F" ? ["F"] : Object.keys(K.ties).filter(id=>id.replace(/\d+$/,"")===st);
    for (const id of ids){ const t = K.ties[id]; if (t && (t.hi===code || t.lo===code)){
      seq.push(matchInfo(`ko:${id}:1`, K)); if (st!=="F") seq.push(matchInfo(`ko:${id}:2`, K)); } }
  }
  return seq.filter(Boolean);
}
const plKey = (team, pl) => team + "|" + String(pl).trim().toLowerCase();
function discipline(){
  const K = knockout(standings());
  const players = {}, byMatch = {};
  const seqCache = {};
  const cards = Object.entries(S.cards).map(([id,c])=>({id, ...c, info: matchInfo(c.match, K)})).filter(c=>c.info);
  cards.sort((x,y)=> x.info.order - y.info.order || String(x.t).localeCompare(String(y.t)));
  for (const c of cards){
    const k = plKey(c.team, c.pl);
    const p = players[k] ||= {key:k, pl:c.pl, team:c.team, y:0, yLate:0, reds:0, cards:[], bans:[]};
    p.cards.push(c);
    let reason = null, games = 1;
    if (c.type === "Y"){
      if (c.info.late){ p.yLate++; if (p.yLate>=4 && p.yLate%2===0) reason = `${p.yLate}-я ЖК (1/2 финала)`; }
      else { p.y++; if (p.y>=4 && p.y%2===0) reason = `${p.y}-я жёлтая`; }
    } else if (c.type === "YR"){ p.reds++; reason = "две ЖК в матче (удаление)"; }
    else { p.reds++; reason = "прямая красная"; games = c.games || 1; }
    if (!reason) continue;
    const seq = seqCache[c.team] ||= teamSeq(c.team, K);
    const i = seq.findIndex(m=>m.mid===c.match);
    const miss = seq.slice(i+1, i+1+games);
    const ban = {reason, from:c.info, games, miss, pending: games - miss.length};
    p.bans.push(ban);
    for (const m of miss) (byMatch[m.mid] ||= []).push({pl:p.pl, team:c.team, reason});
  }
  // a player is "one card away" when the next yellow would be 4th/6th/8th/10th in the current count
  const now = Object.values(players);
  now.forEach(p=>{ const lateActive = cards.some(c=>c.info.late) ; const n = lateActive ? p.yLate : p.y; p.risk = n>=3 && n%2===1; p.ycount = n; });
  return {players: now, byMatch, K, cards};
}

// ---------------------------------------------------------------- participants' stats
// Every played match of the tournament (league + knockout legs), with the score from the home side.
function playedMatches(K){
  const out = [];
  FIXTURES.forEach(f=>{ const r = S.results[f.id]; if (r && isNum(r.h) && isNum(r.a))
    out.push({mid:f.id, h:f.h, a:f.a, hs:r.h, as:r.a, md:f.md, label:`Тур ${f.md}`, order:f.md}); });
  Object.values(K.ties).forEach(t=>{
    if (!t.hi || !t.lo) return;
    const st = t.id.replace(/\d+$/,"");
    const push = (leg, h, a, hs, as) => { if (isNum(hs) && isNum(as)) { const m = matchInfo(`ko:${t.id}:${leg}`, K);
      out.push({mid:`ko:${t.id}:${leg}`, h, a, hs, as, md:null, label:m?m.label:t.id, order:m?m.order:99}); } };
    if (t.single) push(1, t.hi, t.lo, t.l1.hi, t.l1.lo);
    else { push(1, t.lo, t.hi, t.l1.lo, t.l1.hi); push(2, t.hi, t.lo, t.l2.hi, t.l2.lo); }
  });
  return out.sort((x,y)=>x.order-y.order);
}
function participantStats(){
  const rows = standings(), K = knockout(rows), D = disc();
  const pos = {}; rows.forEach(r=>pos[r.c]=r);
  const P = [0,1,2,3].map(i=>({i, n:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, form:[], big:null, own:0, teams:[], y:0, r:0}));
  const H = [0,1,2,3].map(()=>[0,1,2,3].map(()=>({w:0,d:0,l:0,gf:0,ga:0,n:0})));
  const curve = [0,1,2,3].map(()=>Array(9).fill(0));   // cumulative league points after each matchday
  const matches = playedMatches(K);
  for (const m of matches){
    const oh = ownerOf(m.h), oa = ownerOf(m.a);
    const sides = [[m.h, oh, m.hs, m.as, m.a], [m.a, oa, m.as, m.hs, m.h]];
    for (const [team, o, gf, ga, opp] of sides){
      if (o===null) continue;
      const p = P[o]; p.n++; p.gf+=gf; p.ga+=ga;
      const res = gf>ga ? "W" : gf<ga ? "L" : "D";
      p[res.toLowerCase()]++;
      p.form.push({res, team, opp, gf, ga, label:m.label});
      if (m.md){ const pts = res==="W"?3:res==="D"?1:0; p.pts += pts; curve[o][m.md] += pts; }
      if (res==="W" && (!p.big || gf-ga > p.big.gf-p.big.ga || (gf-ga===p.big.gf-p.big.ga && gf>p.big.gf))) p.big = {team, opp, gf, ga, label:m.label};
    }
    if (oh!==null && oa!==null){
      if (oh===oa){ P[oh].own++; continue; }
      const a = H[oh][oa], b = H[oa][oh];
      a.n++; b.n++; a.gf+=m.hs; a.ga+=m.as; b.gf+=m.as; b.ga+=m.hs;
      if (m.hs>m.as){ a.w++; b.l++; } else if (m.hs<m.as){ a.l++; b.w++; } else { a.d++; b.d++; }
    }
  }
  curve.forEach(c=>{ for (let k=1;k<=8;k++) c[k]+=c[k-1]; });
  CODES.forEach(c=>{ const o = ownerOf(c); if (o!==null) P[o].teams.push(pos[c]); });
  D.players.forEach(pl=>{ const o = ownerOf(pl.team); if (o===null) return;
    pl.cards.forEach(c=>{ if (c.type==="Y") P[o].y++; else P[o].r++; }); });
  P.forEach(p=>{ p.teams.sort((a,b)=>a.pos-b.pos); p.gd = p.gf-p.ga; });
  const rank = [...P].sort((a,b)=>b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
  rank.forEach((p,k)=>p.place = k+1);
  const playedMds = Math.max(0, ...FIXTURES.filter(isPlayed).map(f=>f.md));
  return {P, H, curve, rank, playedMds, total: matches.length};
}
function pointsChart(st){
  const W = 640, Hh = 220, L = 36, R = 16, T = 14, B = 30;
  const maxMd = Math.max(1, st.playedMds);
  const maxP = Math.max(3, ...st.curve.map(c=>c[maxMd]));
  const top = Math.ceil(maxP/5)*5 || 5;
  const x = k => L + (W-L-R) * k / maxMd, y = v => T + (Hh-T-B) * (1 - v/top);
  const ticks = []; for (let v=0; v<=top; v+=Math.max(1, Math.round(top/5))) ticks.push(v);
  const grid = ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`).join("");
  const xs = Array.from({length:maxMd+1},(_,k)=>`<text x="${x(k)}" y="${Hh-10}" class="ax" text-anchor="middle">${k===0?"старт":"Т"+k}</text>`).join("");
  const lines = st.curve.map((c,o)=>{ const pts = c.slice(0,maxMd+1).map((v,k)=>`${x(k).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const last = c[maxMd];
    return `<polyline points="${pts}" fill="none" stroke="var(--p${o})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(maxMd)}" cy="${y(last)}" r="4" fill="var(--p${o})"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${Hh}" class="chart" role="img" aria-label="Очки участников по турам">${grid}${xs}${lines}</svg>`;
}

  const ko = STAGES.map(st=>{
    const ids = st==="F" ? ["F"] : Object.keys(K.ties).filter(id=>id.replace(/\d+$/,"")===st);

    return opts ? `<optgroup label="${STAGE_NAME[st][0].toUpperCase()+STAGE_NAME[st].slice(1)}">${opts}</optgroup>` : "";
  }).join("");
  return league + ko;
}

    </tbody></table></div>` : `<div class="note">Карточек пока нет. Выберите матч, команду и игрока выше — или нажмите «＋ карточка» под любым матчем во вкладке «Матчи».</div>`;
  return `<div style="display:grid;gap:6px"><h2>Карточки и дисквалификации</h2>
      <p class="sub">Правила ЛЧ 2026/27: 4-я, 6-я, 8-я и 10-я жёлтая — пропуск следующего матча. Две жёлтые в одном матче — удаление и пропуск матча, эти две жёлтые в общий счёт не идут. Прямая красная — минимум 1 матч. После 1/4 финала жёлтые сгорают.</p></div>
    ${form}
    ${filterBar()}
    <div style="display:grid;gap:8px"><h2>Пропускают следующий матч</h2><div class="panel slist">${upHtml}</div></div>
    <div style="display:grid;gap:8px"><h2>На грани: ещё одна жёлтая — пропуск</h2>${riskHtml}</div>
    <div style="display:grid;gap:8px"><h2>Все игроки с карточками</h2>${tbl}</div>`;
}

function draftInfo(){
  const picks = S.cfg.picks || [], n = picks.length, order = S.cfg.order;
  const turn = n < 36 ? order[n % 4] : null;
  const opt = turn===null ? {free:[], why:{}, allowed:[], pot:-1, fallback:false} : draftOptions(S.cfg.owner, turn);
  return {picks, n, order, done: n >= 36, turn, opt,
    next: n + 1 < 36 ? order[(n + 1) % 4] : null, round: Math.floor(n / 4) + 1};
}
function viewDraft(){
  const D = draftInfo();
  const dis = S.canWrite ? "" : "disabled";
  const pickNo = {}; D.picks.forEach((c,i)=>pickNo[c]=i+1);
  const canOrder = S.canWrite && D.n === 0;
  const names = D.order.map((p,k)=>`
    <div class="panel pin${!D.done && D.turn===p?" now":""}" style="--c:var(--p${p})">
      <div class="qhead"><label for="pname-${p}">${k+1}-й в очереди</label>
        ${canOrder?`<span class="qmove"><button class="btn xs" data-move="${p}" data-dir="-1" ${k===0?"disabled":""} aria-label="Поднять в очереди">←</button><button class="btn xs" data-move="${p}" data-dir="1" ${k===3?"disabled":""} aria-label="Опустить в очереди">→</button></span>`:""}</div>
      <input id="pname-${p}" maxlength="24" placeholder="${PLAYER_DEFAULT[p]}" value="${esc(S.cfg.names[p]||"")}" ${dis}>
      <span class="cnt num">${CODES.filter(c=>ownerOf(c)===p).length} из 9 команд</span>
    </div>`).join("");
  const banner = D.done
    ? `<div class="turn done"><div><div class="tl">Жеребьёвка завершена</div><div class="ts">Все 36 команд разобраны. Можно вносить счета во вкладке «Матчи».</div></div></div>`
    : `<div class="turn" style="--c:var(--p${D.turn})"><span class="own p${D.turn}" style="width:16px;height:16px"></span>
        <div><div class="tl">Выбирает: ${esc(pname(D.turn))}</div>
        <div class="ts num">Выбор ${D.n+1} из 36 · круг ${D.round} из 9${D.next!==null?` · следующий — ${esc(pname(D.next))}`:""}</div>
        <div class="ts">Сейчас выбор из <b>корзины ${D.opt.pot+1}</b> · доступно <b class="num">${D.opt.allowed.length}</b>${D.opt.fallback
          ? ` · <b class="warnc">все свободные команды — соперники команд ${esc(pname(D.turn))}, поэтому можно взять любую из этой корзины</b>`
          : ` · соперников своих команд брать нельзя`}</div></div></div>`;
  const board = POTS.map((list,p)=>`
    <div class="dpot${!D.done && D.opt.pot===p?" active":""}"><h3>Корзина ${p+1}${!D.done && D.opt.pot===p?" · выбор здесь":""} <span class="num">${list.filter(c=>ownerOf(c)===null).length} свободно</span></h3>
      <div class="dgrid">${list.map(c=>{
        const o = ownerOf(c);
        if (o!==null) return `<div class="dcard taken" style="--c:var(--p${o})" aria-label="${esc(CLUBS[c][0])} — занята, ${esc(pname(o))}">
            ${badge(c)}<span class="dn">${esc(CLUBS[c][0])}</span>
            <span class="who"><span class="own p${o}"></span>${esc(pname(o))} · №${pickNo[c]||"—"}</span><span class="stamp">Занята</span></div>`;
        const why = !D.done && !D.opt.fallback ? D.opt.why[c] : null;
        if (!D.done && !why && !D.opt.allowed.includes(c)) return `<div class="dcard waiting" title="Сейчас выбор из корзины ${D.opt.pot+1}">
            ${badge(c)}<span class="dn">${esc(CLUBS[c][0])}</span><span class="who">после корзины ${D.opt.pot+1}</span></div>`;
        if (why) return `<div class="dcard blocked" title="Нельзя: играет с ${esc(why.map(x=>CLUBS[x][0]).join(", "))}">
            ${badge(c)}<span class="dn">${esc(CLUBS[c][0])}</span><span class="who">соперник: ${esc(why.map(x=>CLUBS[x][0]).join(", "))}</span></div>`;
        return `<button class="dcard" data-pick="${c}" ${dis||D.done?"disabled":""} title="Выбрать для ${D.done?"":esc(pname(D.turn))}">
            ${badge(c)}<span class="dn">${esc(CLUBS[c][0])}</span><span class="who">${CLUBS[c][1]}</span></button>`;
      }).join("")}</div></div>`).join("");
  const rosters = D.order.map(p=>{
    const mine = D.picks.filter(c=>ownerOf(c)===p);
    return `<div class="panel roster" style="--c:var(--p${p})"><b>${esc(pname(p))}</b>
      <ol>${mine.map(c=>`<li>${badge(c,true)}<span>${esc(CLUBS[c][0])}</span></li>`).join("")}${Array.from({length:9-mine.length},()=>`<li class="empty">—</li>`).join("")}</ol></div>`;
  }).join("");
  const last = D.n ? D.picks[D.n-1] : null;
  let actions;
  if (S.confirm === "reset") actions = `<span>Сброс удалит все выборы. Введите код сброса:</span><input id="resetCode" class="codein" type="password" inputmode="numeric" autocomplete="off" maxlength="12" aria-label="Код сброса"><button class="btn danger" id="doReset">Сбросить жеребьёвку</button><button class="btn" id="noConfirm">Отмена</button>`;
  else if (S.confirm === "random") actions = `<span>Раздать все 36 команд случайно по текущему порядку (с правилом соперников)?</span><button class="btn danger" id="doRandom">Да, раздать</button><button class="btn" id="noConfirm">Отмена</button>`;
  else actions = `
    ${last?`<button class="btn" id="undoPick" ${dis}>Отменить последний выбор (${esc(CLUBS[last][0])})</button>`:""}
    ${D.n===0?`<button class="btn" id="askRandom" ${dis}>Раздать случайно</button>`:""}
    ${D.n?`<button class="btn" id="askReset" ${dis}>Начать заново</button>`:""}`;
  const firstPick = D.n === 0 ? `<div class="panel first">
      <b>Кто выбирает первым?</b>
      <div class="chips" role="group" aria-label="Кто выбирает первым">
        ${[0,1,2,3].map(p=>`<button class="chip" data-first="${p}" aria-pressed="${D.order[0]===p}" ${S.canWrite?"":"disabled"}><span class="own p${p}"></span>${esc(pname(p))}</button>`).join("")}
        <button class="chip" id="shuffleOrder" ${S.canWrite?"":"disabled"}>Бросить жребий</button>
      </div>
      <p class="sub">Очередь: ${D.order.map(p=>esc(pname(p))).join(" → ")} → снова ${esc(pname(D.order[0]))}. Остальных можно переставить стрелками на карточках.</p>
    </div>` : `<p class="sub">Очередь: ${D.order.map(p=>esc(pname(p))).join(" → ")}. После первого выбора порядок закреплён; чтобы изменить его, начните жеребьёвку заново.</p>`;
  return `<div style="display:grid;gap:6px"><h2>Жеребьёвка</h2>
      <p class="sub">Ходите по очереди: каждый берёт одну команду, потом ход переходит к следующему. Выбранная команда окрашивается в цвет участника и становится недоступна. Корзины разбираются по порядку: берёте команду из первой корзины, где есть доступная вам. Соперников своих команд по общему этапу брать нельзя — такие карточки серые; если таких нет ни в одной корзине, можно взять любую свободную. У каждого будет 9 команд. Страница обновляется сама, ход друга появится через пару секунд.</p></div>
    ${banner}
    ${firstPick}
    <div class="pgrid">${names}</div>
    <div class="actions">${actions}</div>
    <div class="dboard">${board}</div>
    <div><h2 style="margin-bottom:10px">Составы</h2><div class="pgrid">${rosters}</div></div>`;
}

// ---------------------------------------------------------------- render + routing
const VIEWS = {table:viewTable, matches:viewMatches, stats:viewStats, playoff:viewPlayoff, cards:viewCards, draft:viewDraft};
let pendingRender = false;
function currentView(){ const h = location.hash.slice(1); return h==="players" ? "draft" : VIEWS[h] ? h : "table"; }
function render(force){
  DISC = null;
  renderStrip(); renderLeader();
  const active = document.activeElement;
  if (!force && active && (active.tagName === "INPUT" || active.tagName === "SELECT") && $("#view").contains(active)){ pendingRender = true; return; }
  pendingRender = false;
  const v = currentView();
  document.querySelectorAll(".tabs a").forEach(a=>a.setAttribute("aria-current", a.getAttribute("href")==="#"+v ? "page" : "false"));
  $("#view").innerHTML = VIEWS[v]();
}
function renderLeader(){
  const rows = standings();
  const os = ownerStats(rows).filter(o=>o.n);
  if (!os.length || !playedCount()){ $("#leaderLine").innerHTML = ""; return; }
  os.sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
  $("#leaderLine").innerHTML = `Лидер зачёта: <b>${esc(pname(os[0].i))}</b> · ${os[0].pts} очк.`;
}
function setStatus(){
  const el = $("#status");
  el.className = "status " + (!S.dbReady ? "off" : S.canWrite ? "ok" : "ro");
  el.lastElementChild.textContent = !S.dbReady
    ? "Нет связи с сервером — проверьте интернет"
    : S.canWrite ? "Изменения сохраняются и видны всем" : "Только просмотр";
}
window.addEventListener("hashchange", ()=>render(true));
document.addEventListener("focusout", ()=>{ setTimeout(()=>{ if (pendingRender) render(); }, 0); });

// ---------------------------------------------------------------- events
document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if (!t) return;
  if ("md" in t.dataset){ S.md = +t.dataset.md; saveFilters(); render(true); return; }
  if (t.dataset.status){ S.status = t.dataset.status; saveFilters(); render(true); return; }
  if ("filter" in t.dataset){ S.filter = t.dataset.filter===""?null:+t.dataset.filter; saveFilters(); render(true); return; }
  if (t.dataset.team){ S.team = t.dataset.team; saveFilters();
    if (currentView()==="stats" || currentView()==="draft") location.hash = "#table"; else render(true);
    window.scrollTo({top:0, behavior:"smooth"}); return; }
  if (t.id==="f-team-clear"){ S.team = null; saveFilters(); render(true); return; }
  if (t.id==="f-reset"){ S.filter = null; S.team = null; S.md = 0; S.status = "all"; saveFilters(); render(true); return; }
  if (t.dataset.pick){ pickTeam(t.dataset.pick); return; }
  if (t.dataset.cardopen){ const mid = t.dataset.cardopen; S.inl = S.inl.mid===mid ? {...S.inl, mid:null} : {...S.inl, mid, team:""}; render(true);
    if (S.inl.mid){ const i = document.getElementById("ic-player"); i && i.focus({preventScroll:true}); } return; }
  if (t.dataset.iteam){ S.inl.team = t.dataset.iteam; render(true); const i = document.getElementById("ic-player"); i && i.focus({preventScroll:true}); return; }
  if (t.dataset.itype){ S.inl.type = t.dataset.itype; render(true); return; }
  if (t.id==="ic-add"){ addInlineCard(t.dataset.mid); return; }
  if (t.dataset.cardmatch){ const f = FIXTURES.find(x=>x.id===t.dataset.cardmatch); S.cardForm = {...S.cardForm, match:t.dataset.cardmatch, team:f?f.h:""}; location.hash = "#cards"; return; }
  if (t.dataset.ctype){ S.cardForm.type = t.dataset.ctype; render(true); return; }
  if (t.id==="c-add"){ addCard(); return; }
  if (t.dataset.cdel){ S.cardDel = t.dataset.cdel; render(true); return; }
  if (t.dataset.cdelok){ const id = t.dataset.cdelok; S.cardDel = null; delete S.cards[id]; render(true); send({op:"cardDel", id}).then(()=>toast("Карточка удалена")); return; }
  if (t.dataset.pen){ savePen(t.dataset.pen, t.dataset.side); return; }
  if (t.id==="undoPick"){ send({op:"undo", n:S.cfg.picks.length}); return; }
  if (t.id==="askReset"){ S.confirm = "reset"; render(true); return; }
  if (t.id==="askRandom"){ S.confirm = "random"; render(true); return; }
  if (t.id==="noConfirm"){ S.confirm = null; render(true); return; }
  if (t.id==="doReset"){ const c = (document.getElementById("resetCode")||{}).value || "";
    if (!c.trim()){ toast("Введите код сброса"); return; }
    S.confirm = null; render(true); send({op:"draftReset", code:c.trim()}).then(()=>{ if (!S.cfg.picks.length) toast("Жеребьёвка сброшена"); }); return; }
  if (t.id==="doRandom"){ S.confirm = null; randomDraft(); return; }
  if (t.dataset.first){ const p = +t.dataset.first; setOrder([p, ...S.cfg.order.filter(x=>x!==p)]); return; }
  if (t.dataset.move){ const p = +t.dataset.move, o = [...S.cfg.order], i = o.indexOf(p), j = i + (+t.dataset.dir);
    if (j>=0 && j<4){ [o[i],o[j]] = [o[j],o[i]]; setOrder(o); } return; }
  if (t.id==="shuffleOrder"){ const o = [0,1,2,3].sort(()=>Math.random()-.5); setOrder(o); toast(`Жребий: первым выбирает ${pname(o[0])}`); return; }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.id === "f-team"){ S.team = el.value || null; saveFilters(); render(true); return; }
  if (el.id === "c-match"){ S.cardForm.match = el.value; S.cardForm.team = ""; render(true); return; }
  if (el.id === "c-team"){ S.cardForm.team = el.value; render(true); return; }
  if (el.id === "ic-games"){ S.inl.games = Math.min(10, Math.max(1, Math.floor(+el.value)||1)); return; }
  if (el.id === "c-games"){ S.cardForm.games = Math.min(10, Math.max(1, Math.floor(+el.value)||1)); return; }
  if (el.id && el.id.startsWith("s-")){ saveMatch(el.closest(".m").dataset.id); }
  else if (el.id && el.id.startsWith("k-")){ saveTie(el.closest(".tie")); }
  else if (el.id && el.id.startsWith("pname-")){ saveName(+el.id.slice(6), el.value); }
});
document.addEventListener("keydown", e=>{
  if (e.key==="Enter" && e.target.id==="c-player"){ e.preventDefault(); addCard(); return; }
  if (e.key==="Enter" && e.target.id==="resetCode"){ e.preventDefault(); document.getElementById("doReset").click(); return; }
  if (e.key==="Enter" && e.target.id==="ic-player"){ e.preventDefault(); addInlineCard(S.inl.mid); return; }
  if (e.key==="Enter" && e.target.tagName==="INPUT") e.target.blur(); });

function readNum(id){ const el = document.getElementById(id); if (!el) return null; const v = el.value.trim(); if (v==="") return null; const n = Math.floor(+v); return Number.isFinite(n) && n>=0 && n<100 ? n : null; }

function saveMatch(id){
  if (!S.canWrite) return;
  const h = readNum(`s-${id}-h`), a = readNum(`s-${id}-a`);
  const row = document.querySelector(`.m[data-id="${id}"]`);
  if (h===null && a===null){
    if (!S.results[id]) return;
    delete S.results[id]; row && row.classList.remove("done");
    send({op:"match", id, h:null, a:null}).then(()=>toast("Результат удалён"));
  } else if (h!==null && a!==null){
    const cur = S.results[id];
    if (cur && cur.h===h && cur.a===a) return;
    S.results[id] = {h,a}; row && row.classList.add("saving");
    send({op:"match", id, h, a});
  }
  renderStrip(); renderLeader();
}
function saveTie(card){
  if (!S.canWrite) return;
  const id = card.dataset.tie, hi = card.dataset.hi, lo = card.dataset.lo;
  const single = id === "F";
  const prev = S.ko[id] && S.ko[id].a===hi && S.ko[id].b===lo ? S.ko[id] : {};
  const doc = {a:hi, b:lo,
    l1:{hi:readNum(`k-${id}-l1-hi`), lo:readNum(`k-${id}-l1-lo`)},
    l2: single ? {} : {hi:readNum(`k-${id}-l2-hi`), lo:readNum(`k-${id}-l2-lo`)},
    pen: prev.pen || null};
  S.ko[id] = doc; send({op:"ko", id, doc});
}
function savePen(id, side){
  if (!S.canWrite) return;
  const card = document.querySelector(`.tie[data-tie="${id}"]`); if (!card) return;
  const hi = card.dataset.hi, lo = card.dataset.lo;
  const cur = S.ko[id] && S.ko[id].a===hi ? S.ko[id] : {a:hi,b:lo,l1:{},l2:{}};
  const doc = {...cur, pen: cur.pen===side ? null : side};
  S.ko[id] = doc; render(true); send({op:"ko", id, doc});
}
function saveName(i, v){
  if (!S.canWrite) return;
  const name = v.trim().slice(0,24);
  if (name === (S.cfg.names[i]||"")) return;
  S.cfg.names[i] = name; send({op:"name", i, name}); render();
}
function setOrder(o){
  if (!S.canWrite || S.cfg.picks.length) return;
  if (o.join() === S.cfg.order.join()) return;
  S.cfg.order = o; render(true); send({op:"order", order:o});
}
function submitCard(card, el){
  S.cards = {...S.cards, ["tmp"+Date.now()]: {...card, t:new Date().toISOString()}};
  if (el) el.value = "";
  render(true);
  const i = document.getElementById(el ? el.id : ""); i && i.focus({preventScroll:true});
  toast(`${{Y:"Жёлтая",YR:"Удаление (2 ЖК)",R:"Красная"}[card.type]}: ${card.pl}`);
  send({op:"card", card});
}
function addInlineCard(mid){
  if (!S.canWrite || !mid) return;
  const I = S.inl, el = document.getElementById("ic-player");
  const pl = (el && el.value || "").trim();
  if (!pl){ toast("Впишите имя игрока"); el && el.focus(); return; }
  const g = document.getElementById("ic-games"); if (g) I.games = Math.min(10, Math.max(1, Math.floor(+g.value)||1));
  submitCard({team:I.team, pl, match:mid, type:I.type, games: I.type==="R" ? I.games : 1}, el);
}
function addCard(){
  if (!S.canWrite) return;
  const F = S.cardForm, el = document.getElementById("c-player");
  const pl = (el && el.value || "").trim();
  if (!F.match){ toast("Выберите матч"); return; }
  if (!F.team){ toast("Выберите команду"); return; }
  if (!pl){ toast("Впишите имя игрока"); el && el.focus(); return; }
  const g = document.getElementById("c-games"); if (g) F.games = Math.min(10, Math.max(1, Math.floor(+g.value)||1));
  submitCard({team:F.team, pl, match:F.match, type:F.type, games: F.type==="R" ? F.games : 1}, el);
}
function pickTeam(code){
  if (!S.canWrite) return;
  const D = draftInfo();
  if (D.done || ownerOf(code)!==null) return;
  if (!D.opt.allowed.includes(code)){
    toast(!D.opt.fallback && D.opt.why[code] ? `Нельзя: играет с ${D.opt.why[code].map(x=>CLUBS[x][0]).join(", ")}` : `Сейчас выбор из корзины ${D.opt.pot+1}`); return; }
  S.cfg.owner = {...S.cfg.owner, [code]: D.turn}; S.cfg.picks = [...D.picks, code];
  render(true);
  toast(`${pname(D.turn)} берёт ${CLUBS[code][0]}`);
  send({op:"pick", code, n:D.n});
}
function randomDraft(){
  // simulate the draft turn by turn with the opponent rule; random choice among allowed clubs
  const owner = {}, picks = [];
  for (let i=0;i<36;i++){ const p = S.cfg.order[i%4], o = draftOptions(owner, p);
    const pool = o.allowed, c = pool[Math.floor(Math.random()*pool.length)];
    owner[c] = p; picks.push(c); }
  S.cfg.picks = picks; S.cfg.owner = owner;
  render(true); send({op:"draftRandom", picks}); toast("Команды разданы");
}

// ---------------------------------------------------------------- boot
render(true); setStatus(); load();
let tick = 0;
// Refresh: every 3 s on the draft page while picks are in progress, otherwise every 15 s.
setInterval(()=>{ tick++; if (document.visibilityState !== "visible") return;
  const live = currentView()==="draft" && S.cfg.picks.length < 36;
  if (live || tick % 5 === 0) load(); }, 3000);
document.addEventListener("visibilitychange", ()=>{ if (document.visibilityState === "visible") load(); });
</script>
</body>
</html>
